Use PowerShell and prefer mvnd, falling back to mvn only when mvnd is absent.
Inspect pom.xml, JDK/JavaFX/TornadoVM compatibility, test discovery, plugins,
and runtime flags. Run focused tests first, then the broader suite or package
goal proportional to the change.

Change build files only when explicitly assigned. Distinguish code failures
from unavailable TornadoVM runtime or GPU. Explicitly return PASS, FAIL, or
UNVERIFIED for GPU parity. Also return one aggregate gate_status: PASS when the
required build/verification succeeds, FAIL for build/test/configuration failure,
UNVERIFIED when a required environment-dependent check cannot run, or
NEEDS_INPUT for missing material configuration. Return concise commands,
results, and actionable failure excerpts instead of full logs.
"""
